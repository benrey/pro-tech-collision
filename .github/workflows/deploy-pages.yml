name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The auth proxy needs a server; the static showcase has none.
      # (Supabase env is absent here too, so admin shows its setup notice.)
      - name: Remove server-only proxy for static export
        run: rm src/proxy.ts

      # Served at the apex via Cloudflare, so no basePath: the site sits at /
      # on ptcollisioninc.com, not at /<repo> on github.io. Cloudflare proxies
      # this origin -- see terraform/ for the DNS and edge config.
      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_SITE_URL: https://ptcollisioninc.com

      # Visit counting. The only file that differs from the build: the loader,
      # which needs the Cloudflare Web Analytics site token (Terraform output
      # web_analytics_token) and/or the Google tag ID. Both are public, served
      # to every visitor. Until one variable is set the placeholder ships and
      # nothing is counted.
      - name: Write the analytics loader
        if: vars.WEB_ANALYTICS_TOKEN != '' || vars.GOOGLE_TAG_ID != ''
        env:
          ANALYTICS_TOKEN: ${{ vars.WEB_ANALYTICS_TOKEN }}
          GOOGLE_TAG_ID: ${{ vars.GOOGLE_TAG_ID }}
        run: node scripts/analytics.mjs

      - run: touch out/.nojekyll

      # Tells GitHub Pages to accept the custom domain. Without it Pages serves
      # the site only under github.io and 404s the proxied Cloudflare requests.
      - name: Add CNAME for the custom domain
        run: echo 'ptcollisioninc.com' > out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
