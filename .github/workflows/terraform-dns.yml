name: Terraform DNS

on:
  workflow_dispatch:
    inputs:
      action:
        description: "plan (safe, read-only) or apply"
        required: true
        default: plan
        type: choice
        options: [plan, apply]
      targets:
        description: "optional -target args, space separated (partial apply)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-dns.yml"

permissions:
  contents: read
  pages: write

concurrency:
  group: terraform-dns
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Confirm Secrets and Vars
        run: |
          echo "ZONE_ID: ${{ vars.ZONE_ID }}"
          echo "CLOUDFLARE_API_TOKEN length:" ${{ secrets.CLOUDFLARE_API_TOKEN }} | wc -c
          echo "DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}"
          echo "PAGES_CNAME_TARGET: ${{ vars.PAGES_CNAME_TARGET }}"
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ vars.ZONE_ID }}" ]; then
            echo "::error::ZONE_ID variable is not set"
            exit 1
          fi

      - name: Terraform Init
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # Remote state only when R2 is configured. Without it Terraform falls
          # back to local state, which cannot track existing resources between
          # runs -- see backend.tf.
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ]; then
            echo "Using R2 remote state"
            cat > backend.hcl <<EOF
          bucket    = "${R2_BUCKET:-protech-tf-state}"
          endpoints = { s3 = "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" }
          EOF
            init_args="-backend-config=backend.hcl"
          else
            echo "::warning::R2 not configured - using LOCAL state. Existing resources will conflict."
            rm -f backend.tf
            init_args=""
          fi
          max_retries=3
          retry_count=0
          until terraform init -upgrade $init_args; do
            retry_count=$((retry_count + 1))
            if [ $retry_count -ge $max_retries ]; then
              echo "Terraform init failed after $max_retries attempts"
              exit 1
            fi
            echo "Terraform init failed, retrying in 10 seconds... (attempt $retry_count/$max_retries)"
            sleep 10
          done

      - name: Terraform Plan
        env:
          TARGETS: ${{ inputs.targets }}
          TF_VAR_cloudflare_zone_id: ${{ vars.ZONE_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_pages_cname_target: ${{ vars.PAGES_CNAME_TARGET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          args=()
          for t in ${TARGETS:-}; do args+=("-target=$t"); done
          [ -n "${TF_VAR_domain_name:-}" ] || unset TF_VAR_domain_name
          [ -n "${TF_VAR_pages_cname_target:-}" ] || unset TF_VAR_pages_cname_target
          terraform plan -lock-timeout=10m -out=tfplan "${args[@]}"

      - name: Guard against touching mail records
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          terraform show -json tfplan > plan.json
          python3 - plan.json <<'PY'
          import json, sys

          plan = json.load(open(sys.argv[1]))
          hits = []
          for c in plan.get("resource_changes", []):
              actions = c.get("change", {}).get("actions", [])
              if actions in (["no-op"], ["read"]):
                  continue
              after = c.get("change", {}).get("after") or {}
              before = c.get("change", {}).get("before") or {}
              rtype = after.get("type") or before.get("type") or ""
              name = after.get("name") or before.get("name") or ""
              content = str(after.get("content") or before.get("content") or "")
              if rtype in ("TXT", "MX") or "_dmarc" in name or "spf1" in content:
                  hits.append(f"{c.get('address')} [{rtype} {name}] {actions}")

          if hits:
              print("::error::Plan touches mail records — refusing to continue:")
              for h in hits:
                  print(f"  {h}")
              sys.exit(1)
          print("✅ Plan touches no TXT/MX records; mail is unaffected.")
          PY

      - name: Terraform Apply
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: terraform apply -auto-approve -lock-timeout=10m tfplan
